name: build

on:
  workflow_dispatch:
    inputs:
      macos:
        description: macOS too, its minutes cost ten times as much
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: Version stamped into the build, a tag like v0.9.0 or a bare 0.9.0
        type: string
        required: true
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  # Called from the release workflow, the group must differ from the caller's own.
  group: ${{ github.workflow }}-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - if: inputs.version
        run: node scripts/set-version.mjs "$VERSION"
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles nsis
        working-directory: app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boltay-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    # The oldest Ubuntu the packages are for: GTK, WebKit and glibc in the AppImage are no
    # newer than it has. ONNX Runtime is the official build, linked dynamically and shipped
    # in the package, see scripts/fetch-ort.sh.
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || inputs.version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - if: inputs.version
        run: node scripts/set-version.mjs "$VERSION"
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
      - run: ./scripts/linux-deps.sh
      - run: |
          echo "ORT_LIB_LOCATION=$(./scripts/fetch-ort.sh)" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles appimage,deb --config src-tauri/tauri.linux-bundle.json
        working-directory: app
        env:
          # linuxdeploy is itself an AppImage and runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # linuxdeploy's bundled strip chokes on sections newer toolchains emit.
          NO_STRIP: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boltay-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  linux-smoke:
    # A clean 22.04 with only the runtime packages: both packages must start and keep
    # running until killed. Exit code 124 is timeout's.
    needs: linux
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: boltay-linux
          path: bundle
      - run: ./scripts/linux-deps.sh --runtime
      - name: AppImage
        run: |
          chmod +x bundle/appimage/*.AppImage
          scripts/smoke.sh bundle/appimage/*.AppImage --appimage-extract-and-run
      - name: deb
        run: |
          apt-get install -y ./bundle/deb/*.deb
          scripts/smoke.sh boltay-app

  macos:
    # Apple Silicon only: neither Microsoft nor the ort crate ship ONNX Runtime 1.28 for
    # Intel Macs. It is built for macOS 13.4, so the app asks for that too. Minutes on
    # macOS cost ten times as much: releases, or by hand when asked.
    runs-on: macos-14
    if: inputs.macos || inputs.version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - if: inputs.version
        run: node scripts/set-version.mjs "$VERSION"
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
      - run: npm ci
        working-directory: app
      # Our own certificate instead of an ad hoc signature: macOS ties the microphone and
      # Accessibility grants to it, so they survive updates. It is no Developer ID, so
      # Gatekeeper still asks on the first launch. Without it the build stays ad hoc.
      # Only this step sees the certificate: the build runs the scripts of hundreds of crates
      # and npm packages.
      - name: Signing keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$MACOS_CERTIFICATE" ] || { echo "no certificate: ad hoc signature"; exit 0; }
          keychain=$RUNNER_TEMP/signing.keychain-db
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys -passin env:PASSWORD > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/signing.pem"
          rm "$RUNNER_TEMP/signing.p12"
          echo "APPLE_SIGNING_IDENTITY=Boltay Signing" >> "$GITHUB_ENV"
      - run: npx tauri build --bundles dmg
        working-directory: app
      # The bundler removes the .app once the dmg is made: check the one users get. The
      # oldest macOS the binary and the ONNX Runtime inside it accept goes to the log too.
      - name: Signature
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" target/release/bundle/dmg/*.dmg
          app=$RUNNER_TEMP/dmg/Boltay.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - --requirements - --verbose=2 "$app" 2>&1
          vtool -show-build "$app/Contents/MacOS/boltay-app" | grep -E "minos|sdk"
          find ~/Library/Caches -name "libonnxruntime*.a" -exec otool -l {} \; 2>/dev/null |
            grep -E "^ +minos" | sort | uniq -c
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boltay-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
